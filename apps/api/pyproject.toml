[project]
name = "wodly"
version = "0.1.0"
description = "your personal box"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "sqlalchemy[asyncio]>=2.1.9",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ryff.lint]
select = ["E","F","I","UP","B","ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]

