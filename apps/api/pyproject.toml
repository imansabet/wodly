[project]
name = "wodly"
version = "0.1.0"
description = "your personal box"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.9",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ryff.lint]
select = ["E","F","I","UP","B","ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
env = [ 
	"WODLY_DATABSE_URL = postgresql+asyncpg://dbuser:wodly_dev@localhost:5434/wodly_test",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.5.0",
    "pytest-env>=1.8.8",
]

