name: wodly

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: wodly_dev
      POSTGRES_DB: wodly
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - wodly_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL","pg_isready -U dbuser  -d wodly" ] 
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wodly_pgdata:
